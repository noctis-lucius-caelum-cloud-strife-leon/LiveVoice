name: Build Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build bundled application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name LiveVoice --add-data "web;web" --collect-all edge_tts --collect-all TikTokLive --collect-all pygame --collect-all webview --collect-all certifi launcher.py
      - name: Compile Windows installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\LiveVoice.iss"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LiveVoice-Windows-Installer
          path: installer/output/LiveVoice-Setup.exe
      - name: Upload portable version
        uses: actions/upload-artifact@v4
        with:
          name: LiveVoice-Windows-Portable
          path: dist/LiveVoice/
